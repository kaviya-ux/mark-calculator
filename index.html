
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Calculator</title>
</head>
<body>
    <div class="main-container">
        <div class="calculator">
            <h1>
                Student Grade Calculator
            </h1>
            <p class="subtitle">
                Enter student marks
            </p>
            <div class="form-group">
                <label>
                    Student Name
                </label>
                <input type="name" id="name" placeholder="Enter student name">
            </div>
            <div class="form-group">
                <label> English </label>
                <input type="number" id="english" placeholder="0 - 100">
            </div>
            <div class="form-group">
                <label> Mathematics  </label>
                <input type="number" id="maths" placeholder="0 - 100" >
            </div>
            <div class="form-group">
                <label>   Science </label>
                <input type="number"id="science"  placeholder="0 - 100">
            </div>
            <div class="form-group">
                <label> Computer Science  </label>
                <input type="number" id="computer"placeholder="0 - 100">
            </div>
            <div class="form-group">
                <label> Social Science </label>
                <input type="number" id="social"  placeholder="0 - 100"  >
            </div>
            <button class="add-btn"  onclick="calculateGrade()">
                Add Student
            </button>
            <p id="error"></p>
        </div>
        <!-- RIGHT SIDE : STUDENT RECORDS -->
        <div class="records">
            <h2>
                Student Records
            </h2>
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Total</th>
                        <th>Percentage</th>
                        <th>Grade</th>
                        <th>Result</th>
                    </tr>
                </thead>
                <tbody id="studentTable">
                    <tr>
                        <td colspan="7" class="empty">
                            No student records yet.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script>
        let studentRecords = [];
        function calculateGrade() {
            const name = document.getElementById("name").value.trim();
            const english =Number(document.getElementById("english").value);
            const maths =
                Number(document.getElementById("maths").value);
            const science =
                Number(document.getElementById("science").value);
            const computer =
                Number(document.getElementById("computer").value);
            const social =
                Number(document.getElementById("social").value);
            const error =
                document.getElementById("error");
            /* Name validation */
            if (name === "") {
                error.textContent =
                    "Please enter student name.";
                return;
            }
            /* Marks validation */
            const marks = [
                english, maths, science, computer, social
            ];
            for (let mark of marks) {
                if (
                    isNaN(mark) || mark < 0 || mark > 100
                ) {
                    error.textContent =
                        "Please enter all marks between 0 and 100.";
                    return;
                }
            }
            const total = english + maths + science + computer + social;
            const percentage =total / 5;
            let grade;
            if (percentage >= 90) {
                grade = "A+";
            }
            else if (percentage >= 80) {
                grade = "A";
            }
            else if (percentage >= 70) {
                grade = "B";
            }
            else if (percentage >= 60) {
                grade = "C";
            }
            else if (percentage >= 50) {
                grade = "D";
            }
            else {
                grade = "F";
            }
            let status;
            if (
                english >= 35 && maths >= 35 && science >= 35 && computer >= 35 && social >= 35
            ) {
                status = "PASS";
            }
            else {
                status = "FAIL";
            }
            const student = {
                name: name,
                total: total,
                percentage:
                    percentage.toFixed(2),
                grade: grade,
                status: status
            };
            studentRecords.push(student);
            displayRecords();
            document.getElementById("name").value = "";
            document.getElementById("english").value = "";
            document.getElementById("maths").value = "";
            document.getElementById("science").value = "";
            document.getElementById("computer").value = "";
            document.getElementById("social").value = "";
            error.textContent = "";
        }
        function displayRecords() {
            const table =document.getElementById("studentTable");
            table.innerHTML = "";
            studentRecords.forEach(
                function(student, index) {
                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td>
                            ${index + 1}
                        </td>
                        <td>
                            ${student.name}
                        </td>
                        <td>
                            ${student.total}/500
                        </td>
                        <td>
                            ${student.percentage}%
                        </td>
                        <td>
                            ${student.grade}
                        </td>
                        <td>
                            ${student.status}
                        </td>
                        <td>
                            <button class="delete-btn" onclick="deleteStudent(${index})">
                                Delete
                            </button>
                        </td>
                    `;
                    table.appendChild(row);
                }
            );
        }
        function deleteStudent(index) {
            studentRecords.splice(index, 1);
            displayRecords();
        }
    </script>
</body>
</html>
